name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Fills in the Gradle wrapper, settings.gradle.kts, themes and launcher
      # icons that are not committed. Existing sources are kept.
      - name: Generate missing Android scaffold
        run: flutter create --platforms=android --org com.procam --project-name procam_reel_master .

      - run: flutter pub get

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: procam-reel-master-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
