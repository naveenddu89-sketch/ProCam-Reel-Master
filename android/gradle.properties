org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 defaults to the new DSL, which rejects the classic `android { }`
# accessors used by app/build.gradle.kts. Keeping the old DSL makes the build
# reproducible without touching the app module. Remove this line only after
# migrating build.gradle.kts to the AGP 9 DSL.
android.newDsl=false
